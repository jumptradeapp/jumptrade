name = "jumptrade"
main = "worker/index.js"
compatibility_date = "2026-11-01"
# Keep variables/secrets added in the Cloudflare dashboard when deploying from GitHub.
keep_vars = true

# The app itself (static files) is served from ./web; everything under /api/* goes to the worker.
[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Small persistent store for the Webull session token.
[[durable_objects.bindings]]
name = "VAULT"
class_name = "Vault"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Vault"]

# Every minute: push alerts. Every 10 minutes: keep the Webull session alive.
[triggers]
crons = ["* * * * *"]
